# 部署 site：推送 site/* tag 时，应用基础设施（Terraform），构建 React Web 产物上传 OSS，刷新 CDN。
#
# 架构：site/* tag → Actions（terraform apply + npm build + ossutil cp）
#   → OSS 桶（qthealth-site 静态网站模式）→ 阿里云 CDN（health.quanttide.com，泛域名证书 *.quanttide.com）
#
# 所需 GitHub secrets（org 级）：
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET：RAM 用户 AccessKey（terraform + OSS 上传 + CDN 刷新）

name: Deploy Site

on:
  push:
    tags:
      - 'site/**'

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  OSS_BUCKET: qthealth-site
  OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
  CDN_DOMAIN: health.quanttide.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3

      - name: Apply infrastructure (Terraform)
        working-directory: manifests/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET || 'quanttide-terraform-state' }}" \
            -backend-config="key=qthealth/site.tfstate" \
            -backend-config="region=cn-hangzhou"
          terraform apply -input=false -auto-approve \
            -var region=cn-hangzhou \
            -var environment=prod \
            -var oss_bucket_name=qthealth-site \
            -var image=placeholder \
            -target=alicloud_oss_bucket.studio \
            -target=alicloud_cdn_domain_new.studio \
            -target=alicloud_cdn_domain_config.studio_private_back \
            -target=alicloud_cdn_domain_config.studio_root_rewrite \
            -target=alicloud_cdn_domain_config.studio_https_force \
            -target=alicloud_alidns_record.studio
        env:
          ALICLOUD_ACCESS_KEY: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALICLOUD_SECRET_KEY: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Build site
        working-directory: src/site
        run: |
          npm ci
          npm run build

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      - run: ossutil cp src/site/dist/ oss://${{ env.OSS_BUCKET }}/ -r -f --meta=Cache-Control:public,max-age=31536000

      - name: Refresh CDN
        run: |
          curl -s -X POST "https://cdn.aliyuncs.com/?Action=RefreshObjectCaches&ObjectType=Directory" \
            -H "x-acs-access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}" \
            -H "x-acs-access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" \
            -d "ObjectPath=https://${{ env.CDN_DOMAIN }}/" || true
